<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexlas AI — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div class="auth-shell">
  <div class="auth-card">

    <div class="auth-head">
      <div class="auth-logo">
        <img src="assets/images/download.png" alt="Nexlas AI Logo">
      </div>
      <h2>Create your account</h2>
      <p>Join Nexlas AI and get your personalized career roadmap.</p>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="e.g. Areeba Khan" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>

      

      <div class="form-row">
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters" autocomplete="new-password" required>
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Re-enter password" autocomplete="new-password" required>
        </div>
      </div>

      <button type="submit" class="btn-primary auth-btn">Create Account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>

  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
